<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seekra — Speak</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="slide slide-dark">
  <div class="glow bl"></div>
  <div class="relative z-10 h-full flex flex-col justify-center max-w-4xl">
    <div class="eyebrow eyebrow-tan mb-3">Capability · Speak</div>
    <h1 class="headline" style="font-size:42px">Speak to your archive. In <span class="tan">Arabic</span> or English<span class="red">.</span></h1>
    <div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px">
      <div style="display:flex;align-items:center;gap:12px"><span class="material-icons" style="color:#B59876;font-size:22px">mic</span><span style="font-size:13px;font-weight:500;color:#E7E6E4">Speech in, spoken answers out</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="material-icons" style="color:#B59876;font-size:22px">translate</span><span style="font-size:13px;font-weight:500;color:#E7E6E4">Arabic as first-class — RTL + Naskh</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="material-icons" style="color:#B59876;font-size:22px">navigation</span><span style="font-size:13px;font-weight:500;color:#E7E6E4">Voice navigation: "open document 3"</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="material-icons" style="color:#B59876;font-size:22px">public</span><span style="font-size:13px;font-weight:500;color:#E7E6E4">Built for Gulf — rare combination</span></div>
    </div>
    <div style="margin-top:24px;padding:12px 18px;background:rgba(181,152,118,0.10);border:1px solid rgba(181,152,118,0.30);border-radius:8px;display:inline-flex;align-items:center;gap:12px">
      <span style="font-size:16px;color:#E7E6E4">العربية</span><span style="color:#B59876">·</span><span style="font-size:16px;color:#E7E6E4">English</span>
    </div>
  </div>
</div>
</body>
</html>
